name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Test (py${{ matrix.python-version }})
    # ubuntu-latest now resolves to 26.04, where setup-python has no 3.8/3.9 builds.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e . pytest ruff
      - name: Lint
        run: ruff check src tests zerot_lite.py
      - name: Tests
        run: pytest -q

  self-scan:
    name: Self-scan (code scanning)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Scan own source for Unicode tricks
        # Our own code must be clean; scan src + the standalone lite file.
        run: zerot scan src zerot_lite.py --format sarif -o zerot.sarif
        continue-on-error: true
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: zerot.sarif
